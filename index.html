<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Contratos</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #f3f4f6; }
  </style>
</head>
<body class="text-gray-800 font-sans">

  <header class="bg-blue-900 text-white shadow-md py-4 px-6 w-full">
    <div class="w-full px-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">
        <i class="fa-solid fa-file-contract mr-2"></i>
        Gestão de Contratos
      </h1>

      <div class="flex items-center gap-3">
        <button onclick="carregarDados()" class="text-xs bg-blue-700 hover:bg-blue-600 text-white px-3 py-1 rounded-full flex items-center gap-1 transition cursor-pointer">
          <i class="fa-solid fa-rotate"></i> Atualizar
        </button>
        <span class="text-sm bg-blue-800 px-3 py-1 rounded-full">Sistema Online</span>
      </div>
    </div>
  </header>

  <main class="w-full px-6 py-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 uppercase font-semibold">Total de Contratos</p>
        <h3 id="cardTotalContratos" class="text-2xl font-bold text-blue-900 mt-1">0</h3>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 uppercase font-semibold">Ativos</p>
        <h3 id="cardAtivos" class="text-xl font-bold text-green-600 mt-1">0</h3>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 uppercase font-semibold">Vencendo em 30 dias</p>
        <h3 id="cardVencendo" class="text-xl font-bold text-amber-600 mt-1">0</h3>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 uppercase font-semibold">Valor Total</p>
        <h3 id="cardValorTotal" class="text-xl font-bold text-indigo-600 mt-1">R$ 0</h3>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden w-full">
      <div class="p-4 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
        <h2 class="font-bold text-gray-700">Histórico de Contratos</h2>

        <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
          <div class="flex items-center gap-1 bg-gray-50 border border-gray-300 rounded-lg px-3 py-1 text-sm">
            <i class="fa-regular fa-calendar text-gray-400"></i>
            <input type="date" id="filterDate" onchange="filtrarTabela()" class="bg-transparent outline-none text-xs text-gray-700 cursor-pointer">
          </div>

          <div class="flex items-center gap-1 bg-gray-50 border border-gray-300 rounded-lg px-3 py-1 text-sm">
            <i class="fa-solid fa-search text-gray-400"></i>
            <input type="text" id="filterText" onkeyup="filtrarTabela()" placeholder="Filtrar fornecedor, número ou status..." class="bg-transparent outline-none text-xs text-gray-700 w-full sm:w-72">
          </div>
        </div>
      </div>

      <div class="overflow-x-auto w-full">
        <table id="tabelaContratos" class="w-full text-left border-collapse text-xs whitespace-nowrap">
          <thead>
            <tr class="bg-gray-100 text-gray-600 uppercase">
              <th class="p-3">Contrato</th>
              <th class="p-3">Fornecedor</th>
              <th class="p-3">Categoria</th>
              <th class="p-3">Valor</th>
              <th class="p-3">Data Assinatura</th>
              <th class="p-3">Vencimento</th>
              <th class="p-3">Status</th>
              <th class="p-3">Observações</th>
            </tr>
          </thead>
          <tbody id="corpoTabela" class="divide-y divide-gray-100">
            <tr>
              <td colspan="8" class="p-6 text-center text-gray-400">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Carregando contratos...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    function normalizarData(valor) {
      if (!valor) return null;

      let texto = String(valor).trim();

      // yyyy-mm-dd
      if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) {
        return texto;
      }

      // dd/mm/yyyy
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(texto)) {
        const [dia, mes, ano] = texto.split('/');
        return `${ano}-${mes}-${dia}`;
      }

      // ISO 2025-11-18T00:00:00Z
      if (texto.includes('T')) {
        return texto.split('T')[0];
      }

      return null;
    }

    function formatarDataBR(valor) {
      if (!valor) return '-';

      const dataNormalizada = normalizarData(valor);
      if (!dataNormalizada) return '-';

      const d = new Date(dataNormalizada + 'T00:00:00');
      if (isNaN(d.getTime())) return '-';

      return d.toLocaleDateString('pt-BR');
    }

    function statusClass(status) {
      const s = (status || '').toLowerCase();

      if (s.includes('ativo')) return 'bg-green-100 text-green-700';
      if (s.includes('venc')) return 'bg-red-100 text-red-700';
      if (s.includes('pend')) return 'bg-yellow-100 text-yellow-700';
      if (s.includes('renov')) return 'bg-blue-100 text-blue-700';
      if (s.includes('inativ')) return 'bg-gray-100 text-gray-700';

      return 'bg-gray-100 text-gray-700';
    }

    function formatarMoeda(valor) {
      const numero = Number(valor || 0);
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      }).format(numero);
    }

    async function carregarDados() {
      const corpoTabela = document.getElementById('corpoTabela');

      try {
        const resposta = await fetch('contratos.json?t=' + new Date().getTime());
        const dados = await resposta.json();

        corpoTabela.innerHTML = '';

        if (!dados || dados.length === 0) {
          corpoTabela.innerHTML = `
            <tr>
              <td colspan="8" class="p-6 text-center text-gray-400">
                Nenhum contrato registrado.
              </td>
            </tr>
          `;
          atualizarCards([]);
          return;
        }

        dados.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-gray-50';

          tr.innerHTML = `
            <td class="p-3 font-semibold">${item.Contrato || item['Contrato nº'] || '-'}</td>
            <td class="p-3">${item.Fornecedor || '-'}</td>
            <td class="p-3">${item.Categoria || item['Serviço'] || '-'}</td>
            <td class="p-3 text-right font-semibold">${formatarMoeda(item.Valor || 0)}</td>
            <td class="p-3">${formatarDataBR(item.DataAssinatura || item['Data Assinatura'] || '')}</td>
            <td class="p-3">${formatarDataBR(item.Vencimento || item['Data Vencimento'] || '')}</td>
            <td class="p-3">
              <span class="px-2 py-1 rounded-full text-xs font-semibold ${statusClass(item.Status || '')}">
                ${item.Status || '-'}
              </span>
            </td>
            <td class="p-3">${item.Observacoes || item['Observações'] || '-'}</td>
          `;

          corpoTabela.appendChild(tr);
        });

        atualizarCards(dados);
        filtrarTabela();

      } catch (erro) {
        console.error('Erro ao carregar contratos.json:', erro);
        corpoTabela.innerHTML = `
          <tr>
            <td colspan="8" class="p-6 text-center text-red-500 font-semibold">
              Erro ao carregar os dados do arquivo contratos.json.
            </td>
          </tr>
        `;
      }
    }

    function atualizarCards(dados) {
      let totalContratos = dados.length;
      let ativos = 0;
      let vencendo = 0;
      let valorTotal = 0;

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      dados.forEach(item => {
        const status = (item.Status || '').toLowerCase();
        const valor = Number(item.Valor || 0);

        if (status.includes('ativo')) ativos++;

        const dataVencimento = item.Vencimento || item['Data Vencimento'];
        if (dataVencimento) {
          const dataNormalizada = normalizarData(dataVencimento);
          if (dataNormalizada) {
            const d = new Date(dataNormalizada + 'T00:00:00');
            if (!isNaN(d.getTime())) {
              const diff = (d - hoje) / (1000 * 60 * 60 * 24);
              if (diff >= 0 && diff <= 30) vencendo++;
            }
          }
        }

        valorTotal += valor;
      });

      document.getElementById('cardTotalContratos').innerText = totalContratos;
      document.getElementById('cardAtivos').innerText = ativos;
      document.getElementById('cardVencendo').innerText = vencendo;
      document.getElementById('cardValorTotal').innerText = formatarMoeda(valorTotal);
    }

    function filtrarTabela() {
      const inputDate = document.getElementById('filterDate').value;
      const inputTxt = document.getElementById('filterText').value.toLowerCase();
      const tabela = document.getElementById('tabelaContratos');
      const linhas = tabela.getElementsByTagName('tr');

      for (let i = 1; i < linhas.length; i++) {
        const tdContrato = linhas[i].getElementsByTagName('td')[0];
        const tdFornecedor = linhas[i].getElementsByTagName('td')[1];
        const tdCategoria = linhas[i].getElementsByTagName('td')[2];
        const tdStatus = linhas[i].getElementsByTagName('td')[6];
        const tdObservacoes = linhas[i].getElementsByTagName('td')[7];
        const tdVencimento = linhas[i].getElementsByTagName('td')[5];

        if (!tdContrato || !tdFornecedor || !tdStatus || !tdVencimento) continue;

        const textoContrato = tdContrato.textContent || tdContrato.innerText;
        const textoFornecedor = tdFornecedor.textContent || tdFornecedor.innerText;
        const textoCategoria = tdCategoria.textContent || tdCategoria.innerText;
        const textoStatus = tdStatus.textContent || tdStatus.innerText;
        const textoObservacoes = tdObservacoes.textContent || tdObservacoes.innerText;
        const textoVencimento = tdVencimento.textContent || tdVencimento.innerText;

        let matchDate = true;
        if (inputDate) {
          const dataNormalizada = normalizarData(textoVencimento);
          matchDate = dataNormalizada ? dataNormalizada === inputDate : false;
        }

        const textoCombinado = (
          textoContrato + ' ' +
          textoFornecedor + ' ' +
          textoCategoria + ' ' +
          textoStatus + ' ' +
          textoObservacoes
        ).toLowerCase();

        const matchText = textoCombinado.includes(inputTxt);

        linhas[i].style.display = (matchDate && matchText) ? '' : 'none';
      }
    }

    window.onload = carregarDados;
  </script>
</body>
</html>
