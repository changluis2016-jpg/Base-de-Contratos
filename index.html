<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão e Acompanhamento de Contratos</title>
    <!-- Tus estilos y librerías actuales -->
</head>
<body>
    <!-- Tu estructura HTML existente -->

    <script>
        // Función para convertir la fecha serial de Excel a formato legible DD/MM/YYYY
        function converterDataExcel(serial) {
            if (!serial || isNaN(serial)) return serial;
            const utc_days = Math.floor(serial - 25569);
            const utc_value = utc_days * 86400 * 1000;
            const data_obj = new Date(utc_value);
            
            const dia = String(data_obj.getUTCDate()).padStart(2, '0');
            const mes = String(data_obj.getUTCMonth() + 1).padStart(2, '0');
            const ano = data_obj.getUTCFullYear();
            
            return `${dia}/${mes}/${ano}`;
        }

        // Función para cargar y renderizar los contratos desde tu archivo contratos.json
        async function carregarContratos() {
            try {
                // Si el JSON está en el mismo repositorio, se carga directamente
                const resposta = await fetch('contratos.json');
                const dados = await resposta.json();

                const tbody = document.querySelector('table tbody'); // Asegúrate de que apunta al tbody de tu tabla
                if (!tbody) return;
                
                tbody.innerHTML = '';

                dados.forEach(contrato => {
                    // Se aplica la conversión en el campo de fecha (ajusta 'Vencimento' según el nombre exacto de la columna en tu Excel)
                    const dataFormatada = converterDataExcel(contrato.Vencimento);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${contrato.Serviço || ''}</td>
                        <td>${contrato.Unidade || ''}</td>
                        <td>${contrato.Contrato || ''}</td>
                        <td>${contrato.Origem || ''}</td>
                        <td>${dataFormatada}</td>
                        <td>${contrato['Dias p/ Vencer'] || ''}</td>
                        <td>${contrato.Status || ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (erro) {
                console.error('Erro ao carregar os contratos:', erro);
            }
        }

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', carregarContratos);
    </script>
</body>
</html>
