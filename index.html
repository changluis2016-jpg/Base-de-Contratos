<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Contratos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .badge-critico { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .badge-atencao { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-regular { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Cabeçalho -->
        <header class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Painel de Contratos</h1>
                <p class="text-sm text-gray-500 mt-1">Sincronizado automaticamente via SharePoint e GitHub</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="Pesquisar contratos..." 
                    class="w-full md:w-80 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </header>

        <!-- Tabela -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-800 text-white uppercase text-xs tracking-wider">
                            <th class="py-3 px-4 font-semibold">Serviço</th>
                            <th class="py-3 px-4 font-semibold">Unidade</th>
                            <th class="py-3 px-4 font-semibold">Contrato</th>
                            <th class="py-3 px-4 font-semibold">Origem</th>
                            <th class="py-3 px-4 font-semibold text-right">Valor do Contrato</th>
                            <th class="py-3 px-4 font-semibold text-center">Vencimento</th>
                            <th class="py-3 px-4 font-semibold text-center">Dias p/ Vencer</th>
                            <th class="py-3 px-4 font-semibold text-center">Faixa</th>
                            <th class="py-3 px-4 font-semibold text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200">
                        <!-- Os dados serão injetados via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Função para converter o número serial do Excel para data DD/MM/YYYY
        function excelDateToJSDate(serial) {
            if (!serial || isNaN(serial)) return serial;
            const utc_days = Math.floor(serial - 25569);
            const utc_value = utc_days * 86400;
            const date_info = new Date(utc_value * 1000);
            
            const day = String(date_info.getUTCDate()).padStart(2, '0');
            const month = String(date_info.getUTCMonth() + 1).padStart(2, '0');
            const year = date_info.getUTCFullYear();
            return `${day}/${month}/${year}`;
        }

        // Função para formatar valores monetários em Reais
        function formatCurrency(value) {
            if (!value || isNaN(value)) return "-";
            return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Função para definir a classe visual baseada no status
        function getStatusBadgeClass(status) {
            if (!status) return 'bg-gray-100 text-gray-800';
            const s = status.toLowerCase();
            if (s.includes('crítico')) return 'badge-critico font-bold';
            if (s.includes('atenção')) return 'badge-atencao font-bold';
            if (s.includes('regular')) return 'badge-regular font-bold';
            return 'bg-gray-100 text-gray-800';
        }

        async function loadContracts() {
            try {
                // Busca o arquivo JSON gerado no repositório do GitHub
                const response = await fetch('contratos.json');
                if (!response.ok) throw new Error('Erro ao carregar os dados');
                
                const data = await response.json();
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = '';

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';

                    const vencimentoFormatado = excelDateToJSDate(item["Vencimento"]);
                    const valorFormatado = formatCurrency(item["Valor do Contrato"]);
                    const badgeClass = getStatusBadgeClass(item["Status"]);

                    tr.innerHTML = `
                        <td class="py-3 px-4">${item["Serviço"] || ''}</td>
                        <td class="py-3 px-4 font-medium text-gray-900">${item["Unidade"] || ''}</td>
                        <td class="py-3 px-4">${item["Contrato"] || ''}</td>
                        <td class="py-3 px-4 text-gray-500">${item["Origem"] || ''}</td>
                        <td class="py-3 px-4 text-right">${valorFormatado}</td>
                        <td class="py-3 px-4 text-center">${vencimentoFormatado}</td>
                        <td class="py-3 px-4 text-center font-semibold">${item["Dias p/ Vencer"] || ''}</td>
                        <td class="py-3 px-4 text-center">${item["Faixa"] || ''}</td>
                        <td class="py-3 px-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-xs inline-block ${badgeClass}">
                                ${item["Status"] || ''}
                            </span>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                // Funcionalidade de pesquisa em tempo real
                document.getElementById('searchInput').addEventListener('keyup', function(e) {
                    const term = e.target.value.toLowerCase();
                    const rows = tableBody.getElementsByTagName('tr');
                    
                    Array.from(rows).forEach(row => {
                        const text = row.textContent.toLowerCase();
                        row.style.display = text.includes(term) ? '' : 'none';
                    });
                });

            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center py-6 text-red-500">Erro ao carregar os dados dos contratos. Verifique se o arquivo contratos.json existe no repositório.</td>
                    </tr>
                `;
            }
        }

        loadContracts();
    </script>
</body>
</html>
